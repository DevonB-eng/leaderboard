name: usage_stats
description: "Android usage-stats access for the leaderboard app, available to background isolates."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.devonbeng.usage_stats
        pluginClass: UsageStatsPlugin
