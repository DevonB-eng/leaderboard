name: leaderboard
description: "Android/IOS app that displays a real time screen time leaderboard with your friends"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  app_usage: ^4.0.1
  crypto: ^3.0.6
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.0.2
  permission_handler: ^12.0.1
  supabase_flutter: ^2.12.2
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4  
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/Gemini_Generated_Image_jhggv1jhggv1jhgg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0C0A1A"
  adaptive_icon_foreground: "lib/assets/Gemini_Generated_Image_jhggv1jhggv1jhgg.png"
  web:
    generate: false